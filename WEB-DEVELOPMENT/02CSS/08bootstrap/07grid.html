<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="05.css">
</head>
<body>
<div class="container">


    <!--      allignments chahiye toh vahi jake deko       same as css bt use in inline -->
    <div class="row">
        <div class="  col-6 bg-success" >one</div>
        <div class=" col-6 bg-primary">two</div>
    </div><br>
    <div class="row">
        <div class="col-md-2 bg-success">one</div>
        <div class="col bg-primary">two</div>
        <div class="col bg-success">one</div>
        <!-- agar median size ya use chote aye toh har column 100%width use karega -->
    </div>
    <br>
    <div class="row">
        <div class="col-md-2 col-xl-2 bg-success">one</div>
        <div class="col-md-3 col-xl-3 bg-primary">two</div>
        <div class="col-md-4 col-xl-4 bg-success">one</div>
        <!-- agar median size ya use chote aye toh har column 100%width use karega  dho dho condition yak bar set kar sakte-->
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
