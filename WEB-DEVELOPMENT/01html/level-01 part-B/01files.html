<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LISTS</title>
</head>
<body>
    <!-- UNORDERED LISTS -->
    <!--  types = circle,square,default  -->
    <ul type="circle">    
        <li><h1>want to buy</h1></li>
        <li>heloo</li>
        <li>hi sir </li>
        <li>its me </li>
    </ul>
    <!-- ORDERED LISTS  -->
    <ol type="A">   <!--types   = A ,a ,1 ,i-->
        <li>name  </li>
        <li>class</li>
 <li>sub</li>
 <li>branch</li>
    </ol>
</body>
</html>
