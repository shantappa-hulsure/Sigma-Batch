<body>
    <form action="/action">
        <h1>Registration form</h1>
        <input type="text" placeholder="first name" id="name" >
        <input type="text" placeholder="last name" id="name" ><br>

        </select> <br>
        Do you agree to all our terms

        <input type="checkbox" id="terms">

    </form>
